<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum Please — NOW Index | Global Asset Rankings</title>
  <meta name="description" content="NOW Quant Framework — Open Platform & Public Ranking System. Real-time global asset rankings, leaderboards, and quantitative analysis." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
</head>
<body class="dark-mode">
  <div id="app">
    <!-- Top Navigation -->
    <nav class="top-nav" id="topNav">
      <div class="nav-brand">
        <span class="brand-icon">⟁</span>
        <span class="brand-text">Momentum <span class="brand-highlight">Please</span></span>
        <span class="brand-beta">NOW Index</span>
      </div>
      <div class="nav-search" id="navSearch">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search ticker or company..." autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="nav-actions">
        <button class="nav-btn" onclick="toggleTheme()" title="Toggle Theme">
          <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
        <button class="nav-btn" onclick="window.open('https://github.com/Liam-Son/NOW-index','_blank')" title="GitHub">
          <i class="fa-brands fa-github"></i>
        </button>
        <button class="nav-btn" onclick="refreshData()" title="Refresh">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </nav>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <h3 class="sidebar-title">Dashboard</h3>
          <a class="sidebar-link active" data-view="dashboard" onclick="navigate('dashboard')">
            <i class="fa-solid fa-chart-pie"></i> Overview
          </a>
          <a class="sidebar-link" data-view="leaderboard" onclick="navigate('leaderboard')">
            <i class="fa-solid fa-trophy"></i> Leaderboards
          </a>
          <a class="sidebar-link" data-view="ranking" onclick="navigate('ranking')">
            <i class="fa-solid fa-list"></i> Full Ranking
          </a>
        </div>
        <div class="sidebar-section">
          <h3 class="sidebar-title">Analysis</h3>
          <a class="sidebar-link" data-view="company" onclick="navigate('company')">
            <i class="fa-solid fa-building"></i> Company Profile
          </a>
          <a class="sidebar-link" data-view="compare" onclick="navigate('compare')">
            <i class="fa-solid fa-not-equal"></i> Comparison Tool
          </a>
          <a class="sidebar-link" data-view="watchlist" onclick="navigate('watchlist')">
            <i class="fa-solid fa-star"></i> Watchlist
          </a>
          <a class="sidebar-link" data-view="simulator" onclick="navigate('simulator')">
            <i class="fa-solid fa-chart-simple"></i> Portfolio Simulator
          </a>
        </div>
        <div class="sidebar-section">
          <h3 class="sidebar-title">Learn</h3>
          <a class="sidebar-link" data-view="methodology" onclick="navigate('methodology')">
            <i class="fa-solid fa-flask"></i> Methodology
          </a>
          <a class="sidebar-link" data-view="blog" onclick="navigate('blog')">
            <i class="fa-solid fa-blog"></i> Blog & Research
          </a>
          <a class="sidebar-link" data-view="docs" onclick="navigate('docs')">
            <i class="fa-solid fa-book"></i> API Docs
          </a>
        </div>
        <div class="sidebar-footer">
          <div class="live-indicator">
            <span class="live-dot"></span> Live
          </div>
          <span class="refresh-time" id="refreshTime">--</span>
        </div>
      </aside>

      <!-- Content Area -->
      <main class="content" id="content">
        <!-- Dynamic content loaded here -->
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.0/dist/apexcharts.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
